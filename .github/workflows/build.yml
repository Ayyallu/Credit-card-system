name: Build

on:
  push:
    branches: [ master, main, phase-* ]
  pull_request:
    branches: [ master, main, phase-* ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CC_Ingenio.sln

      # SAP Crystal Reports for Visual Studio is used directly by
      # CC_Ingenio.Reporting (and therefore CC_Ingenio.Manager and
      # CC_Ingenio.Web, which depend on it). It's a licensed, interactively
      # installed product referenced via a hardcoded local path - there's no
      # NuGet/silent-install path available for a hosted runner. Report.cs
      # used to live in CC_Ingenio.Common, which blocked the ENTIRE solution
      # (everything depends on Common) from building in CI; it's now isolated
      # in its own project so everything else can be validated for real.
      - name: Build Crystal-Reports-free projects (the real CI gate)
        run: >
          msbuild CC_Ingenio.sln
          /t:CC_Ingenio_Common,CC_Ingenio_Core,CC_Ingenio_Data,CC_Ingenio_Repository,CC_Ingenio_DataTranfer,CC_Ingenio_Resources,CC_Ingenio_Tests
          /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1

      - name: Run unit tests
        run: vstest.console.exe CC_Ingenio.Tests\bin\Release\CC_Ingenio.Tests.dll

      - name: Build CC_Ingenio.Reporting, Manager, Web (require Crystal Reports for VS - expected to fail on a stock runner)
        continue-on-error: true
        run: >
          msbuild CC_Ingenio.sln
          /t:CC_Ingenio_Reporting,CC_Ingenio_Manager,CC_Ingenio_Web
          /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Report known blocker
        if: always()
        run: |
          echo "::notice::CC_Ingenio.Reporting, CC_Ingenio.Manager, and CC_Ingenio.Web require SAP Crystal Reports for Visual Studio, which cannot be installed on a stock GitHub-hosted runner. See PHASE2_NOTES.md for options (self-hosted runner with Crystal Reports installed, or a Crystal Reports replacement). Everything else in the solution, including the test suite, now builds and runs cleanly here."

  # Phase 3: the .NET 8 strangler-fig port, under netcore/. Separate job
  # because it's a completely independent toolchain (dotnet CLI, not
  # MSBuild/.NET Framework) with no shared state with the legacy build.
  build-netcore:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build CC_Ingenio.Core (net8 port)
        run: dotnet build netcore/CC_Ingenio.Core/CC_Ingenio.Core.csproj --configuration Release

      - name: Build CC_Ingenio_Resources (net8 port)
        run: dotnet build netcore/CC_Ingenio_Resources/CC_Ingenio_Resources.csproj --configuration Release

      - name: Build CC_Ingenio.DataTranfer (net8 port)
        run: dotnet build netcore/CC_Ingenio.DataTranfer/CC_Ingenio.DataTranfer.csproj --configuration Release

      # GemCryptor.dll (referenced by this project) has no source and is a
      # .NET 2.0-era binary - this is the real test of whether a .NET 8 app
      # can reference/load it at all. See PORT_NOTES.md.
      - name: Build CC_Ingenio.Common (net8 port)
        run: dotnet build netcore/CC_Ingenio.Common/CC_Ingenio.Common.csproj --configuration Release

      - name: Build CC_Ingenio.Data (net8 / EF Core port)
        run: dotnet build netcore/CC_Ingenio.Data/CC_Ingenio.Data.csproj --configuration Release

      # Builds and validates the whole EF Core model offline (no database):
      # composite keys/FKs, table naming, lazy-loading proxies, DDL generation.
      - name: Test CC_Ingenio.Data model (net8 / EF Core port)
        run: dotnet test netcore/CC_Ingenio.Data.Tests/CC_Ingenio.Data.Tests.csproj --configuration Release

      - name: Build CC_Ingenio.Repository (net8 port)
        run: dotnet build netcore/CC_Ingenio.Repository/CC_Ingenio.Repository.csproj --configuration Release

      # Constructs all 144 repositories and translates each one's query to SQL
      # offline (no database).
      - name: Test CC_Ingenio.Repository (net8 port)
        run: dotnet test netcore/CC_Ingenio.Repository.Tests/CC_Ingenio.Repository.Tests.csproj --configuration Release

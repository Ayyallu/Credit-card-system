name: Build

on:
  push:
    branches: [ master, main, phase-* ]
  pull_request:
    branches: [ master, main, phase-* ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CC_Ingenio.sln

      - name: Build solution
        run: msbuild CC_Ingenio.sln /p:Configuration=Release /p:Platform="Any CPU" /m

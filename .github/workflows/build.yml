name: Build

on:
  push:
    branches: [ master, main, phase-* ]
  pull_request:
    branches: [ master, main, phase-* ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CC_Ingenio.sln

      # CC_Ingenio.Web (and nothing else) references SAP Crystal Reports for
      # Visual Studio via a hardcoded local path (C:\Program Files\Common
      # Files\managed\...). That toolset is a licensed, interactively
      # installed product with no NuGet/silent-install path we can wire into
      # a hosted runner, so this build is split in two: everything that can
      # build cleanly in CI, and the Crystal-Reports-dependent project,
      # which is expected to fail here until it's built on a machine (or a
      # self-hosted runner) that has Crystal Reports for VS installed.
      - name: Build non-Web projects (Common, Core, Data, Repository, Manager, DataTransfer, Resources, Tests)
        run: >
          msbuild CC_Ingenio.sln
          /t:CC_Ingenio_Common,CC_Ingenio_Core,CC_Ingenio_Data,CC_Ingenio_Repository,CC_Ingenio_Manager,CC_Ingenio_DataTranfer,CC_Ingenio_Resources,CC_Ingenio_Tests
          /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1

      - name: Run unit tests
        run: vstest.console.exe CC_Ingenio.Tests\bin\Release\CC_Ingenio.Tests.dll

      - name: Build CC_Ingenio.Web (requires Crystal Reports for VS - expected to fail on a stock runner)
        continue-on-error: true
        run: msbuild CC_Ingenio.sln /t:CC_Ingenio_Web /p:Configuration=Release /p:Platform="Any CPU" /m
